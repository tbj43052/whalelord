<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet><link href="https://fonts.googleapis.com/css2?family=Cinzel:wght@700;900&family=Nunito:wght@500;700;800&family=Manrope:wght@400;500&display=swap" rel="stylesheet"><style>html,body{margin:0;height:100%;background:#050b14;font-family:'Nunito',system-ui,sans-serif;color:#e6f1f7;overflow:hidden}a{color:#d4af37}a:hover{color:#f3d97a}@keyframes orbFloat{0%,100%{transform:translateY(0)}50%{transform:translateY(-6px)}}@keyframes mascotBob{0%,100%{transform:translate(-50%,-50%) scale(1.02) translateY(0) rotate(0deg)}50%{transform:translate(-50%,-50%) scale(1.02) translateY(-10px) rotate(.5deg)}}@keyframes wl-bubble{0%{transform:translateY(0) scale(1);opacity:0}10%{opacity:.7}100%{transform:translateY(-110vh) scale(1.4);opacity:0}}@keyframes wl-rays{0%,100%{opacity:.25}50%{opacity:.5}}@keyframes wl-modal{from{opacity:0;transform:translateY(24px) scale(.96)}to{opacity:1;transform:none}}@keyframes wl-fade{from{opacity:0}to{opacity:1}}@keyframes wl-spin{to{transform:rotate(360deg)}}@keyframes wl-toast{0%{opacity:0;transform:translate(-50%,10px)}15%,85%{opacity:1;transform:translate(-50%,0)}100%{opacity:0;transform:translate(-50%,-10px)}}</style></helmet>
<div style="position:fixed;inset:0;width:100vw;height:100vh;overflow:hidden;background:#0b192e">
  <div style="position:absolute;left:50%;top:50%;transform:translate(-50%,-50%) scale(1.02);animation:mascotBob 6s ease-in-out infinite;width:max(100vw,calc(100vh * 2048 / 1056));aspect-ratio:2048/1056;background-image:url(./assets/whale-lord-hd-stage-v3.png);background-size:cover;background-position:center;background-repeat:no-repeat;image-rendering:-webkit-optimize-contrast">
  <div style="position:absolute;inset:0;pointer-events:none;overflow:hidden">
    <div style="position:absolute;left:20%;top:-20%;width:16%;height:120%;background:linear-gradient(180deg,rgba(160,240,255,.28),rgba(160,240,255,0));transform:skewX(-14deg);filter:blur(24px);animation:wl-rays 7s ease-in-out infinite"></div>
    <div style="position:absolute;left:58%;top:-20%;width:10%;height:120%;background:linear-gradient(180deg,rgba(160,240,255,.22),rgba(160,240,255,0));transform:skewX(-10deg);filter:blur(24px);animation:wl-rays 9s ease-in-out infinite 2s"></div>
    {{ bubbles }}
  </div>
  <sc-for list="{{ orbs }}" as="orb" hint-placeholder-count="5">
    <div style="position:absolute;z-index:20;left:{{ orb.left }};top:{{ orb.top }};width:{{ orb.size }};aspect-ratio:1 / 1;animation:orbFloat {{ orb.dur }} ease-in-out {{ orb.delay }} infinite">
      <button onClick="{{ orb.open }}" onMouseEnter="{{ orb.pop }}" aria-label="{{ orb.title }}" style="display:block;width:100%;height:100%;padding:0;border:0;border-radius:50%;background:transparent;cursor:pointer;overflow:hidden;transition:all .3s cubic-bezier(.34,1.56,.64,1);box-shadow:0 0 0 rgba(212,175,55,0)" style-hover="transform:scale(1.08) translateY(-6px);box-shadow:0 0 35px rgba(212,175,55,.85),0 0 0 2px rgba(243,217,122,.9)">{{ orb.pic }}</button>
    </div>
  </sc-for>
  </div>

  <header style="position:absolute;left:0;right:0;top:0;z-index:3;display:flex;align-items:center;justify-content:space-between;gap:16px;padding:18px 28px;background:linear-gradient(180deg,rgba(5,11,20,.55),rgba(5,11,20,0))">
    <div style="font:900 clamp(22px,2.4vw,36px)/1 'Cinzel',serif;letter-spacing:.08em;text-transform:uppercase;background:linear-gradient(180deg,#fff2b0 0%,#d4af37 45%,#8a6a12 60%,#f3d97a 100%);-webkit-background-clip:text;background-clip:text;color:transparent;filter:drop-shadow(0 3px 0 #3a2a05) drop-shadow(0 0 16px rgba(212,175,55,.6))">The Whale Lord</div>
    <div style="display:flex;align-items:center;gap:10px">
      <a href="{{ telegramUrl }}" target="_blank" title="Telegram" style="width:40px;height:40px;display:grid;place-items:center;background:#fff;border:2px solid #111;box-shadow:3px 3px 0 #111;color:#111;transition:transform .15s,box-shadow .15s" style-hover="transform:translate(-1px,-1px);box-shadow:4px 4px 0 #111"><svg width="20" height="20" viewBox="0 0 24 24" fill="currentColor"><path d="M2.5 11.2 21 3.6c.9-.3 1.6.2 1.3 1.5l-3.1 14.7c-.2 1-.9 1.3-1.7.8l-4.8-3.5-2.3 2.2c-.3.3-.5.5-1 .5l.3-4.9 8.9-8-11 6.9-4.7-1.5c-1-.3-1-1 .6-1.6z"></path></svg></a>
      <a href="{{ xUrl }}" target="_blank" title="X" style="width:40px;height:40px;display:grid;place-items:center;background:#fff;border:2px solid #111;box-shadow:3px 3px 0 #111;color:#111;transition:transform .15s,box-shadow .15s" style-hover="transform:translate(-1px,-1px);box-shadow:4px 4px 0 #111"><svg width="18" height="18" viewBox="0 0 24 24" fill="currentColor"><path d="M18.2 2h3.4l-7.4 8.5L23 22h-6.8l-5.3-7-6.1 7H1.4l7.9-9.1L1 2h7l4.8 6.4L18.2 2zm-1.2 18h1.9L7.1 3.9H5.1L17 20z"></path></svg></a>
      <a href="{{ tokenUrl }}" target="_blank" style="height:40px;display:grid;place-items:center;padding:0 14px;text-decoration:none;background:#f5d547;border:2px solid #111;box-shadow:3px 3px 0 #111;color:#111;font:800 13px/1 'Nunito',sans-serif;letter-spacing:.04em;transition:transform .15s,box-shadow .15s" style-hover="transform:translate(-1px,-1px);box-shadow:4px 4px 0 #111">$WHALELORD</a>
    </div>
  </header>

  <footer style="position:absolute;left:0;right:0;bottom:0;z-index:4;display:grid;grid-template-columns:1fr auto 1fr;align-items:center;gap:16px;padding:12px 28px;background:rgba(5,11,20,.85);backdrop-filter:blur(12px);border-top:1px solid rgba(212,175,55,.35)">
    <div style="font:800 12px/1 'Nunito',sans-serif;letter-spacing:.14em;color:#fff;text-transform:uppercase">Official Website <span style="color:#d4af37;margin:0 6px">|</span> Dive Into Dominance</div>
    <div style="display:flex;align-items:center;gap:8px;position:relative">
      <div style="font:700 13px/1 ui-monospace,Menlo,monospace;color:#e6f1f7;padding:11px 18px;border-radius:999px;background:rgba(255,255,255,.06);border:1px solid rgba(212,175,55,.5);letter-spacing:.02em"><span style="color:#d4af37;font-family:'Nunito',sans-serif;font-weight:800;margin-right:8px">CONTRACT:</span>{{ contract }}</div>
      <button onClick="{{ copy }}" style="cursor:pointer;font:800 13px/1 'Nunito',sans-serif;letter-spacing:.06em;padding:11px 18px;border-radius:999px;border:0;color:#1a1200;background:linear-gradient(180deg,#f3d97a,#d4af37 55%,#b08d24);box-shadow:0 2px 0 #6b520f,0 0 16px rgba(212,175,55,.35);transition:transform .15s,filter .15s" style-hover="filter:brightness(1.1);transform:translateY(-1px)" style-active="transform:translateY(1px);box-shadow:0 0 0 #6b520f">Copy CA</button>
      <sc-if value="{{ toast }}" hint-placeholder-val="{{ false }}">
        <div style="position:absolute;left:50%;bottom:calc(100% + 12px);transform:translateX(-50%);padding:8px 16px;border-radius:999px;background:#d4af37;color:#1a1200;font:800 13px/1 'Nunito',sans-serif;box-shadow:0 6px 20px rgba(0,0,0,.4);animation:wl-toast 1.8s ease forwards;white-space:nowrap">Copied!</div>
      </sc-if>
    </div>
    <div style="text-align:right;font:800 12px/1 'Nunito',sans-serif;letter-spacing:.14em;color:#fff;text-transform:uppercase">Official Website <span style="color:#d4af37;margin:0 6px">|</span> Dive Into Dominance</div>
  </footer>

  <sc-if value="{{ modalOpen }}" hint-placeholder-val="{{ false }}">
    <div onClick="{{ close }}" style="position:fixed;inset:0;z-index:50;display:grid;place-items:center;padding:24px;background:rgba(5,11,20,.6);backdrop-filter:blur(16px);animation:wl-fade .25s ease">
      <div onClick="{{ stop }}" role="dialog" aria-modal="true" style="width:min(880px,100%);max-height:100%;overflow:auto;border-radius:20px;border:1.5px solid rgba(212,175,55,.6);background:linear-gradient(180deg,rgba(14,50,80,.75),rgba(11,25,46,.85));backdrop-filter:blur(20px);box-shadow:0 0 0 1px rgba(255,255,255,.06) inset,0 30px 80px rgba(0,0,0,.6),0 0 60px rgba(212,175,55,.15);animation:wl-modal .35s cubic-bezier(.2,.8,.2,1)">
        <div style="display:flex;align-items:center;justify-content:space-between;gap:16px;padding:22px 28px;border-bottom:1px solid rgba(212,175,55,.25)">
          <h2 style="margin:0;font:700 clamp(18px,2.2vw,28px)/1.1 'Cinzel',serif;background:linear-gradient(180deg,#fff2b0,#d4af37 55%,#b08d24);-webkit-background-clip:text;background-clip:text;color:transparent">{{ active.title }}</h2>
          <div style="display:flex;align-items:center;gap:8px;color:#d4af37;font:700 13px/1 'Nunito',sans-serif">
            <button onClick="{{ prev }}" aria-label="Previous" style="cursor:pointer;width:34px;height:34px;border-radius:50%;border:1.5px solid rgba(212,175,55,.6);background:transparent;color:#d4af37;font-size:18px;line-height:1" style-hover="background:rgba(212,175,55,.15)">‹</button>
            <span style="opacity:.8;min-width:36px;text-align:center">{{ counter }}</span>
            <button onClick="{{ next }}" aria-label="Next" style="cursor:pointer;width:34px;height:34px;border-radius:50%;border:1.5px solid rgba(212,175,55,.6);background:transparent;color:#d4af37;font-size:18px;line-height:1" style-hover="background:rgba(212,175,55,.15)">›</button>
          </div>
        </div>
        <div style="display:grid;grid-template-columns:minmax(0,1.5fr) minmax(0,1fr);gap:24px;padding:24px 28px">
          <div style="position:relative;aspect-ratio:16/9;display:grid;place-items:center">
            <div style="position:absolute;inset:0;display:grid;place-items:center"><div style="width:36px;height:36px;border-radius:50%;border:3px solid rgba(212,175,55,.25);border-top-color:#d4af37;animation:wl-spin 1s linear infinite"></div></div>
            {{ activeImage }}
          </div>
          <div style="display:flex;flex-direction:column;gap:12px;min-width:0">
            <div style="font:800 11px/1 'Nunito',sans-serif;letter-spacing:.2em;text-transform:uppercase;color:#6fd8f0">About</div>
            <p style="margin:0;font:400 16px/1.7 'Manrope',system-ui,sans-serif;letter-spacing:.005em;color:#eaf3f8;text-wrap:pretty">{{ active.lore }}</p>
          </div>
        </div>
        <div style="display:flex;justify-content:flex-end;padding:16px 28px 24px;border-top:1px solid rgba(212,175,55,.25)">
          <button onClick="{{ close }}" style="cursor:pointer;font:800 14px/1 'Nunito',sans-serif;letter-spacing:.08em;padding:12px 28px;border-radius:999px;border:0;color:#1a1200;background:linear-gradient(180deg,#f3d97a,#d4af37 55%,#b08d24);box-shadow:0 2px 0 #6b520f,0 0 16px rgba(212,175,55,.35)" style-hover="filter:brightness(1.1);transform:translateY(-1px)">Close</button>
        </div>
      </div>
    </div>
  </sc-if>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props="{&quot;contract&quot;:{&quot;editor&quot;:&quot;text&quot;,&quot;default&quot;:&quot;0xWh4leL0rd2026c0ntrActAddr3ss456&quot;,&quot;tsType&quot;:&quot;string&quot;,&quot;section&quot;:&quot;Token&quot;},&quot;telegramUrl&quot;:{&quot;editor&quot;:&quot;text&quot;,&quot;default&quot;:&quot;https://t.me/&quot;,&quot;tsType&quot;:&quot;string&quot;,&quot;section&quot;:&quot;Links&quot;},&quot;xUrl&quot;:{&quot;editor&quot;:&quot;text&quot;,&quot;default&quot;:&quot;https://x.com/&quot;,&quot;tsType&quot;:&quot;string&quot;,&quot;section&quot;:&quot;Links&quot;},&quot;tokenUrl&quot;:{&quot;editor&quot;:&quot;text&quot;,&quot;default&quot;:&quot;#&quot;,&quot;tsType&quot;:&quot;string&quot;,&quot;section&quot;:&quot;Links&quot;},&quot;hoverSound&quot;:{&quot;editor&quot;:&quot;boolean&quot;,&quot;default&quot;:true,&quot;tsType&quot;:&quot;boolean&quot;,&quot;section&quot;:&quot;Behavior&quot;}}">
class Component extends DCLogic {
  // Edit this array to change bubble art, titles and panel text. left/top/size are % of the 2048x1056 artwork so each bubble sits over its painted spot.
  memories = [
    { title: 'Feasting on the Competition', image: './assets/feasting-clear.png', lore: 'Fine dining. The paper hands are delicious tonight. $WHALELORD', left: '15.8%', top: '17.8%', size: '14.8%', dur: '4s', delay: '0s' },
    { title: 'The Vault', image: './assets/the-vault.png', lore: 'Collecting memes like they’re infinity stones. We know exactly which bags to hold. Yours should be $WHALELORD.', left: '67.3%', top: '10.2%', size: '15.8%', dur: '5s', delay: '1s' },
    { title: 'Here to Stay', image: './assets/here-to-stay-v2.png', lore: 'This isn\'t a leash. It\'s the anchor holding down the entire market cap. Feel the weight of $WHALELORD.', left: '13.3%', top: '59.5%', size: '16.8%', dur: '4.5s', delay: '0.5s' },
    { title: 'Nonstop', image: './assets/nonstop.png', lore: 'The market never sleeps, and neither do I. While the world dreams, I build the floors they will eventually stand on. Trust the process, trust the chart. $WHALELORD', left: '80%', top: '34.8%', size: '15.8%', dur: '5.5s', delay: '1.5s' },
    { title: 'Whale Watch', image: './assets/whale-watch-v5.png', lore: 'Just spotted another school of jeets trying to swim against the current. Watching them panic sell is better than Netflix. $WHALELORD.', left: '70.2%', top: '62.3%', size: '16.8%', dur: '4.8s', delay: '0.8s' }
  ];
  state = { open: null, toast: 0 };
  constructor(p) {
    super(p);
    const bubbles = Array.from({ length: 22 }, (_, i) => {
      const s = 4 + Math.round(Math.random() * 14);
      return React.createElement('div', { key: i, style: { position: 'absolute', left: (Math.random() * 100) + '%', bottom: '-30px', width: s, height: s, borderRadius: '50%', border: '1px solid rgba(180,235,255,.6)', background: 'radial-gradient(circle at 35% 30%,rgba(255,255,255,.7),rgba(120,220,255,.1))', animation: `wl-bubble ${9 + Math.random() * 12}s linear ${-Math.random() * 20}s infinite` } });
    });
    this.bubbles = React.createElement(React.Fragment, null, bubbles);
    this.onKey = e => { if (this.state.open === null) return; if (e.key === 'Escape') this.close(); if (e.key === 'ArrowRight') this.step(1); if (e.key === 'ArrowLeft') this.step(-1); };
  }
  componentDidMount() { window.addEventListener('keydown', this.onKey); ['pointerdown', 'keydown'].forEach(t => window.addEventListener(t, this.unlockAudio, { passive: true })); }
  // browsers block audio until the first click/keypress; unlock the context then so hover pops can play
  unlockAudio = () => { if (!this.ac) this.ac = new (window.AudioContext || window.webkitAudioContext)(); if (this.ac.state === 'suspended') this.ac.resume(); };
  // one note per orb (C major pentatonic: C5 D5 E5 G5 A5) so sweeping across them plays a jingle
  notes = [523.25, 587.33, 659.25, 783.99, 880];
  pop = (i) => {
    if ((this.props.hoverSound ?? true) === false) return;
    this.unlockAudio(); const ac = this.ac; if (!ac || ac.state !== 'running') return;
    const f = this.notes[i] || 660, t = ac.currentTime, o = ac.createOscillator(), g = ac.createGain();
    o.type = 'sine'; o.frequency.setValueAtTime(f * 0.6, t); o.frequency.exponentialRampToValueAtTime(f * 1.5, t + 0.03); o.frequency.exponentialRampToValueAtTime(f, t + 0.11);
    g.gain.setValueAtTime(0.0001, t); g.gain.exponentialRampToValueAtTime(0.22, t + 0.012); g.gain.exponentialRampToValueAtTime(0.0001, t + 0.14);
    o.connect(g).connect(ac.destination); o.start(t); o.stop(t + 0.16);
  };
  componentWillUnmount() { window.removeEventListener('keydown', this.onKey); }
  close = () => this.setState({ open: null });
  step = d => this.setState(s => ({ open: (s.open + d + this.memories.length) % this.memories.length }));
  renderVals() {
    const p = this.props, o = this.state.open, n = this.memories.length;
    const ca = p.contract ?? '0xWh4leL0rd2026c0ntrActAddr3ss456';
    return {
      bubbles: this.bubbles,
      orbs: this.memories.map((m, i) => ({ ...m, open: () => this.setState({ open: i }), pop: () => this.pop(i), pic: React.createElement('img', { src: m.image, alt: '', style: { display: 'block', width: '100%', height: '100%', borderRadius: '50%', transform: 'scale(1.07)' } }) })),
      modalOpen: o !== null,
      active: this.memories[o ?? 0],
      activeImage: o === null ? null : React.createElement('img', { src: this.memories[o].image, alt: this.memories[o].title, style: { position: 'relative', width: 'auto', height: '100%', maxWidth: '100%', objectFit: 'contain', display: 'block', filter: 'drop-shadow(0 16px 36px rgba(0,0,0,.6))' } }),
      counter: o === null ? '' : `${o + 1} / ${n}`,
      close: this.close, stop: e => e.stopPropagation(), 
      prev: () => this.step(-1), next: () => this.step(1),
      contract: ca,
      toast: this.state.toast,
      copy: () => { navigator.clipboard?.writeText(ca); clearTimeout(this.t); this.setState({ toast: Date.now() }); this.t = setTimeout(() => this.setState({ toast: 0 }), 1800); },
      telegramUrl: p.telegramUrl ?? 'https://t.me/', xUrl: p.xUrl ?? 'https://x.com/', tokenUrl: p.tokenUrl ?? '#'
    };
  }
}
</script>
</body>
</html>
